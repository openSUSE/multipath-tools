name: basic-build-and-ci
on:
  push:
    branches:
      - master
      - queue
      - tip
      - 'stable-*'
  pull_request:
    branches:
      - master
      - queue
      - 'stable-*'
jobs:
  resolute:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        rl: ['', 'libreadline', 'libedit']
        cc: [ gcc, clang ]
    steps:
      - uses: actions/checkout@v7
      - name: update
        run: sudo apt-get update
      - name: dependencies
        run: >
          sudo apt-get install --yes gcc
          make pkg-config valgrind
          libdevmapper-dev libreadline-dev libaio-dev libsystemd-dev
          libudev-dev libjson-c-dev liburcu-dev libcmocka-dev libedit-dev
          libmount-dev
      - name: mpath
        run: sudo modprobe dm_multipath
      - name: zram
        run: sudo modprobe zram num_devices=0
      - name: zram-device
        run: echo ZRAM=$(sudo cat /sys/class/zram-control/hot_add) >> $GITHUB_ENV
      - name: set-zram-size
        run: echo 1G | sudo tee /sys/block/zram$ZRAM/disksize
      - name: set CC
        run: echo CC=${{ matrix.cc }} >> $GITHUB_ENV
      - name: set optflags
        # valgrind doesn't support the dwarf-5 format of clang 14
        run: echo OPT='-O2 -gdwarf-4 -fstack-protector-strong' >> $GITHUB_ENV
        if: matrix.cc == 'clang'
      - name: build
        run: >
          make -Orecurse -j$(nproc)
          READLINE=${{ matrix.rl }} OPTFLAGS="$OPT"
      - name: test
        id: test
        run: >
          make -Orecurse -j$(nproc)
          OPTFLAGS="$OPT" test
        continue-on-error: true
      - name: valgrind-test
        id: valgrind
        run: >
          make -Orecurse -j$(nproc)
          OPTFLAGS="$OPT" valgrind-test
        continue-on-error: true
      - name: clean-nonroot-artifacts
        run: rm -f tests/dmevents.out tests/directio.out
      - name: root-test
        id: root
        run: sudo make DIO_TEST_DEV=/dev/zram$ZRAM test
        continue-on-error: true
      - name: kpartx-test
        id: kpartx
        run: sudo make -C kpartx test
        continue-on-error: true
      - name: create test outputs
        run: make test-progs.tar test-outputs.tar
        if: >
          steps.test.outcome != 'success' ||
          steps.valgrind.outcome != 'success' ||
          steps.root.outcome != 'success' ||
          steps.kpartx.outcome != 'success'
      - name: Upload test programs
        uses: actions/upload-artifact@v7
        with:
          name: resolute-progs-${{ matrix.cc }}-${{ matrix.rl }}
          path: test-progs.tar
          overwrite: true
        if: >
          steps.test.outcome != 'success' ||
          steps.valgrind.outcome != 'success' ||
          steps.root.outcome != 'success' ||
          steps.kpartx.outcome != 'success'
      - name: Upload test outputs
        uses: actions/upload-artifact@v7
        with:
          name: resolute-outputs-${{ matrix.cc }}-${{ matrix.rl }}
          path: test-outputs.tar
          overwrite: true
        if: >
          steps.test.outcome != 'success' ||
          steps.valgrind.outcome != 'success' ||
          steps.root.outcome != 'success' ||
          steps.kpartx.outcome != 'success'
      - name: fail if any test failed
        run: /bin/false
        if: >
          steps.test.outcome != 'success' ||
          steps.valgrind.outcome != 'success' ||
          steps.root.outcome != 'success' ||
          steps.kpartx.outcome != 'success'

  noble:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rl: ['', 'libreadline', 'libedit']
        cc: [ gcc, clang ]
    steps:
      - uses: actions/checkout@v7
      - name: mpath
        run: sudo modprobe dm_multipath
      - name: brd
        run: sudo modprobe brd rd_nr=1 rd_size=65536
      - name: update
        run: sudo apt-get update
      - name: dependencies
        run: >
          sudo apt-get install --yes gcc-10
          make pkg-config valgrind
          libdevmapper-dev libreadline-dev libaio-dev libsystemd-dev
          libudev-dev libjson-c-dev liburcu-dev libcmocka-dev libedit-dev
          libmount-dev
      - name: set CC
        run: echo CC=${{ matrix.cc }} >> $GITHUB_ENV
      - name: build
        run: make -Orecurse -j$(nproc) READLINE=${{ matrix.rl }}
      - name: test
        id: test
        run: make -Orecurse -j$(nproc) test
        continue-on-error: true
      - name: valgrind-test
        id: valgrind
        run: make -Orecurse -j$(nproc) valgrind-test
        continue-on-error: true
      - name: clean-nonroot-artifacts
        run: rm -f tests/dmevents.out tests/directio.out
      - name: root-test
        id: root
        run: sudo make DIO_TEST_DEV=/dev/ram0 test
        continue-on-error: true
      - name: kpartx-test
        id: kpartx
        run: sudo make -C kpartx test
        continue-on-error: true
      - name: create test outputs
        run: make test-progs.tar test-outputs.tar
        if: >
          steps.test.outcome != 'success' ||
          steps.valgrind.outcome != 'success' ||
          steps.root.outcome != 'success' ||
          steps.kpartx.outcome != 'success'
      - name: Upload test programs
        uses: actions/upload-artifact@v7
        with:
          name: noble-progs-${{ matrix.cc }}-${{ matrix.rl }}
          path: test-progs.tar
          overwrite: true
        if: >
          steps.test.outcome != 'success' ||
          steps.valgrind.outcome != 'success' ||
          steps.root.outcome != 'success' ||
          steps.kpartx.outcome != 'success'
      - name: Upload test outputs
        uses: actions/upload-artifact@v7
        with:
          name: noble-outputs-${{ matrix.cc }}-${{ matrix.rl }}
          path: test-outputs.tar
          overwrite: true
        if: >
          steps.test.outcome != 'success' ||
          steps.valgrind.outcome != 'success' ||
          steps.root.outcome != 'success' ||
          steps.kpartx.outcome != 'success'
      - name: fail if any test failed
        run: /bin/false
        if: >
          steps.test.outcome != 'success' ||
          steps.valgrind.outcome != 'success' ||
          steps.root.outcome != 'success' ||
          steps.kpartx.outcome != 'success'
