name: compile and unit test on native arch
on:
  push:
    branches:
      - master
      - queue
      - tip
      - 'stable-*'
    paths:
      - '.github/workflows/native.yaml'
      - '**.h'
      - '**.c'
      - '**Makefile*'
      - '**.mk'
  pull_request:
    branches:
      - master
      - queue
      - 'stable-*'
    paths:
      - '.github/workflows/native.yaml'
      - '**.h'
      - '**.c'
      - '**Makefile*'
      - '**.mk'

jobs:
  stable:
    strategy:
      fail-fast: false
      matrix:
        os:
          - debian-jessie
          - debian-buster
          - debian-bullseye
          - debian-bookworm
          - debian-trixie
          - fedora-43
          - opensuse-leap-15.6
          - opensuse-leap-16.0
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

        # On jessie, we use libreadline 5 (no licensing issue)
      - name: set readline make option (Jessie)
        run: echo READLINE=libreadline >> $GITHUB_ENV
        if: matrix.os == 'debian-jessie'

      - name: build and test
        id: test
        uses: mosteo-actions/docker-run@v1
        with:
          image: ghcr.io/mwilck/multipath-build-${{ matrix.os }}
          command: -j$(nproc) -Orecurse V=1 READLINE=$READLINE test
        continue-on-error: true

      - name: create test-progs.tar
        uses: mosteo-actions/docker-run@v1
        with:
          image: ghcr.io/mwilck/multipath-build-${{ matrix.os }}
          command: test-progs.tar

      - name: upload test-progs.tar
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.variant.arch }}
          path: test-progs.tar
          overwrite: true

      - name: create test-outputs.tar
        uses: mosteo-actions/docker-run@v1
        with:
          image: ghcr.io/mwilck/multipath-build-${{ matrix.os }}
          command: test-outputs.tar
        if: steps.test.outcome != 'success'

      - name: upload test-outputs.tar
        uses: actions/upload-artifact@v4
        with:
          name: gcc-outputs-${{ matrix.os }}-${{ matrix.variant.arch }}
          path: test-outputs.tar
          overwrite: true
        if: steps.test.outcome != 'success'

      - name: fail if test failed
        run: /bin/false
        if: steps.test.outcome != 'success'

  clang:
    strategy:
      fail-fast: false
      matrix:
        os:
          - debian-buster
          - debian-bullseye
          - debian-bookworm
          - debian-trixie
          - fedora-43
          - opensuse-leap-15.6
          - opensuse-leap-16.0
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
        include:
          - os: debian-jessie
            variant:
              arch: x86_64
              runner: ubuntu-24.04
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - name: checkout
        uses: actions/checkout@v4

        # On jessie, we use libreadline 5 (no licensing issue)
      - name: set readline make option (Jessie)
        run: echo READLINE=libreadline >> $GITHUB_ENV
        if: matrix.os == 'debian-jessie'

      - name: build and test with clang
        id: test
        uses: mosteo-actions/docker-run@v1
        with:
          image: ghcr.io/mwilck/multipath-build-${{ matrix.os }}
          params: --pids-limit 4096 -e CC=clang
          command: -j$(nproc) -Orecurse V=1 READLINE=$READLINE test
        continue-on-error: true

      - name: create test-outputs.tar
        uses: mosteo-actions/docker-run@v1
        with:
          image: ghcr.io/mwilck/multipath-build-${{ matrix.os }}
          command: test-outputs.tar
        if: steps.test.outcome != 'success'

      - name: upload test-outputs.tar
        uses: actions/upload-artifact@v4
        with:
          name: clang-outputs-${{ matrix.os }}-${{ matrix.variant.arch }}
          path: test-outputs.tar
          overwrite: true
        if: steps.test.outcome != 'success'

      - name: fail if test failed
        run: /bin/false
        if: steps.test.outcome != 'success'

  root-test:
    needs: stable
    strategy:
      fail-fast: false
      matrix:
        os:
          - debian-jessie
          - debian-buster
          - debian-bullseye
          - debian-bookworm
          - debian-trixie
          - fedora-43
          - opensuse-leap-15.6
          - opensuse-leap-16.0
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - name: mpath
        run: sudo modprobe dm_multipath
      - name: brd
        run: sudo modprobe brd rd_nr=1 rd_size=65536

      - name: checkout
        uses: actions/checkout@v4

      - name: download binary archive
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.os }}-${{ matrix.variant.arch }}

      - name: unpack binary archive
        run: tar xfmv test-progs.tar

      - name: run root tests
        uses: mosteo-actions/docker-run@v1
        with:
          image: ghcr.io/mwilck/multipath-build-${{ matrix.os }}
          guest-dir: /__w/multipath-tools/multipath-tools
          host-dir: ${{ github.workspace }}
          params: >
            --workdir /__w/multipath-tools/multipath-tools --privileged
            -v /dev/ram0:/dev/ram0 -e DIO_TEST_DEV=/dev/ram0
          command: -C tests V=1 directio.out dmevents.out
        id: test
        continue-on-error: true

      - name: create test-outputs.tar
        uses: mosteo-actions/docker-run@v1
        with:
          image: ghcr.io/mwilck/multipath-build-${{ matrix.os }}
          command: test-outputs.tar
        if: steps.test.outcome != 'success'

      - name: upload test-outputs.tar
        uses: actions/upload-artifact@v4
        with:
          name: clang-outputs-${{ matrix.os }}-${{ matrix.variant.arch }}
          path: test-outputs.tar
          overwrite: true
        if: steps.test.outcome != 'success'

      - name: fail if test failed
        run: /bin/false
        if: steps.test.outcome != 'success'
