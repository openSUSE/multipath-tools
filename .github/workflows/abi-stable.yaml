name: check-abi for stable branch
on:
  push:
    branches:
      - 'stable-*'
    paths:
      - '.github/workflows/abi-stable.yaml'
      - '**.h'
      - '**.c'
      - '**.version'
  pull_request:
    branches:
      - 'stable-*'
  workflow_dispatch:
jobs:
  reference-abi:
    runs-on: ubuntu-24.04
    steps:
      - name: get parent tag (push)
        run: >
          echo ${{ github.ref }} |
          sed -E 's,refs/heads/stable-([0-9]\.[0-9]*)\.y,PARENT_TAG=\1.0,' >> $GITHUB_ENV
        if: env.PARENT_TAG == '' && github.event_name != 'pull_request'
      - name: get parent tag (PR)
        run: >
          echo ${{ github.base_ref }} |
          sed -E 's,stable-([0-9]\.[0-9]*)\.y,PARENT_TAG=\1.0,' >> $GITHUB_ENV
        if: env.PARENT_TAG == '' && github.event_name == 'pull_request'
      - name: assert parent tag
        run: /bin/false
        if: env.PARENT_TAG == ''
      - name: try to download ABI for ${{ env.PARENT_TAG }}
        id: download_abi
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: abi-stable.yaml
          workflow_conclusion: ''
          branch: ${{ github.ref_name }}
          name: multipath-abi-${{ env.PARENT_TAG }}
          search_artifacts: true
          path: __unused__
      - name: update
        if: steps.download_abi.outcome != 'success'
        run: sudo apt-get update
      - name: dependencies
        if: steps.download_abi.outcome != 'success'
        run: >
          sudo apt-get install --yes gcc
          gcc make pkg-config abigail-tools
          libdevmapper-dev libreadline-dev libaio-dev libsystemd-dev
          libudev-dev libjson-c-dev liburcu-dev libcmocka-dev libedit-dev
          libmount-dev
      - name: checkout ${{ env.PARENT_TAG }}
        if: steps.download_abi.outcome != 'success'
        uses: actions/checkout@v7
        with:
          ref: ${{ env.PARENT_TAG }}
      - name: build ABI for ${{ env.PARENT_TAG }}
        if: steps.download_abi.outcome != 'success'
        run: make -j$(nproc) -Orecurse abi
      - name: save ABI
        if: steps.download_abi.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: multipath-abi-${{ env.PARENT_TAG }}
          path: abi

  check-abi:
    runs-on: ubuntu-24.04
    needs: reference-abi
    steps:
      - name: get parent tag (push)
        run: >
          echo ${{ github.ref }} |
          sed -E 's,refs/heads/stable-([0-9]\.[0-9]*)\.y,PARENT_TAG=\1.0,' >> $GITHUB_ENV
        if: env.PARENT_TAG == '' && github.event_name != 'pull_request'
      - name: get parent tag (PR)
        run: >
          echo ${{ github.base_ref }} |
          sed -E 's,stable-([0-9]\.[0-9]*)\.y,PARENT_TAG=\1.0,' >> $GITHUB_ENV
        if: env.PARENT_TAG == '' && github.event_name == 'pull_request'
      - name: assert parent tag
        run: /bin/false
        if: env.PARENT_TAG == ''
      - name: checkout ${{ github.ref }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: download ABI for ${{ env.PARENT_TAG }}
        id: download_abi
        uses: dawidd6/action-download-artifact@v21
        with:
          workflow: abi-stable.yaml
          workflow_conclusion: ''
          branch: ${{ github.ref_name }}
          name: multipath-abi-${{ env.PARENT_TAG }}
          search_artifacts: true
          path: reference-abi
      - name: update
        run: sudo apt-get update
      - name: dependencies
        run: >
          sudo apt-get install --yes gcc
          gcc make pkg-config abigail-tools
          libdevmapper-dev libreadline-dev libaio-dev libsystemd-dev
          libudev-dev libjson-c-dev liburcu-dev libcmocka-dev libedit-dev
          libmount-dev
      - name: check ABI of ${{ github.ref }} against ${{ env.PARENT_TAG }}
        id: check_abi
        run: make -j$(nproc) -Orecurse abi-test
        continue-on-error: true
      - name: save differences
        if: steps.check_abi.outcome != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: abi-test
          path: abi-test
      - name: Fetch ${{ env.PARENT_TAG }}
        if: steps.check_abi.outcome != 'success'
        run: >-
          git fetch --depth=1 origin \
              "refs/tags/$PARENT_TAG:refs/tags/$PARENT_TAG"
      - name: Check library versions of ${{ env.PARENT_TAG }} and ${{ github.ref_name }}
        if: steps.check_abi.outcome != 'success'
        # Check for the "ABI differences in ..." heading in abi-test.
        # For each library that differs, make sure that the respective
        # .version file has changes in the library version(s) supported.
        run: |
          ABI_ERROR=()
          while read l; do
              ll=$l/$l.version
              echo "Checking ABI differences in $l ..."
              diff -u \
                  <(git show "$PARENT_TAG:$ll" |
                      sed -nE 's,^([A-Z][-_.0-9A-Za-z]*) *\{,\1,p') \
                  <(git show "HEAD:$ll" |
                      sed -nE 's,^([A-Z][-_.0-9A-Za-z]*) *\{,\1,p') || {
                  case $? in
                  1)
                      echo "... library versions differ, OK"
                      continue
                      ;;
                  *)
                      echo "... error in diff!"
                      ERROR=$l
                      ;;
                  esac
              }
              echo "... library versions do not differ!"
              ABI_ERROR=("${ABI_ERROR[@]}" $l)
          done < \
             <(sed -En 's,^=* ABI differences.*/([-_a-z.]*)-nv\.abi =*,\1,p' \
               abi-test)
          echo "${#ABI_ERROR[@]} ABI errors in ${ABI_ERROR[@]}"
          [[ ${#ABI_ERROR[@]} == 0 && ! $ERROR ]]
